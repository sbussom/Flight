name: Refresh fares & deploy site

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily = 5:00 AM EST / 6:00 AM EDT
  workflow_dispatch: {}    # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths-ignore: ["data/fares.json", "README.md"]

permissions:
  contents: write    # commit data/fares.json back to the repo
  pages: write       # deploy to GitHub Pages
  id-token: write

concurrency:
  group: fares
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh fare cache
        # On push events we skip the scrape and just redeploy the existing cache.
        if: github.event_name != 'push'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional
          FARES_PROXY: ${{ secrets.FARES_PROXY }}   # optional, e.g. http://user:pass@host:port
        run: python scripts/update_fares.py

      - name: Commit updated fares.json
        if: github.event_name != 'push'
        run: |
          git config user.name  "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add data/fares.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Fare refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
